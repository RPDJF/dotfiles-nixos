###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$browser = librewolf
$browser_private = $browser --private-window
$discord = discord --enable-features=UseOzonePlatform --ozone-platform=wayland
$codeapp = code --enable-features=UseOzonePlatform --ozone-platform=wayland
$mail = $browser https://mail.proton.me
$cloud = $browser https://proton.me/drive
$aicompanion = $browser https://lumo.proton.me

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, D, exec, $discord
bind = $mainMod, N, exec, $browser
bind = $mainMod SHIFT, N, exec, $browser_private
bind = $mainMod, X, exec,  $codeapp
bind = $mainMod, O, exec, $mail
bind = $mainMod, P, exec, $cloud
bind = $mainMod, A, exec, $aicompanion
bind = $mainMod, V, exec, $terminal --class clipse -e clipse

# clipboard manager
windowrule = match:class ^(clipse)$, float on
windowrule = match:class ^(clipse)$, size 622 652
windowrule = match:class ^(clipse)$, stay_focused on

# password manager (over browser)
windowrule = match:title ^(vault\.ruinformatique\.ch_/)$, float on
windowrule = match:title ^(vault\.ruinformatique\.ch_/)$, size 1100 800