background {
    monitor =
    path = screenshot
    color = rgba(10, 10, 10, 1.0)
    blur_passes = 1
    blur_size = 15
    noise = 0.05          
    contrast = 1.2        
    vibrancy = 0.0
}

input-field {
    monitor =  
    size = 350, 50
    outline_thickness = 2
    dots_size = 0.33     
    dots_spacing = 0.15  
    dots_center = false  
    dots_text_format = █ 
    outer_color = rgb(0, 255, 65)
    inner_color = rgb(0, 0, 0)
    font_color = rgb(0, 255, 65)
    fade_on_empty = false
    placeholder_text = <span font_family="monospace" foreground="##00FF41"><b>user@hypr:~$ </b>▒</span>
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}