services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-nvidia
    volumes:
      - ~/.docker-composers/data/ollama-nvidia/ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    devices:
      - nvidia.com/gpu=all
    environment:
      - OLLAMA_KEEP_ALIVE=20m
      - OLLAMA_CONTEXT_LENGTH=32768
    restart: unless-stopped
#    dns:
#      - 192.168.1.5

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-nvidia
    # ports:
    #   - "8080:8080"
    volumes:
      - ~/.docker-composers/data/ollama-nvidia/open-webui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama-nvidia:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.enable=true"

      # HTTP router
      - "traefik.http.routers.openwebui.rule=Host(`ai.local.lan`)"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.tls=true"

      # service port inside container
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"

    restart: unless-stopped
#    dns:
#      - 192.168.1.5

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    volumes:
      - ~/.docker-composers/data/ollama-nvidia/searxng:/etc/searxng
    restart: unless-stopped

networks:
  traefik_proxy:
    external: true

